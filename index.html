<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lindokuhle Mlotshwa — Creative Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-dark:#07110f;
    --teal-1:#0d2b28;
    --teal-2:#123d38;
    --teal-3:#1c554d;
    --magenta:#c94f86;
    --cream:#f3ece2;
    --text-soft:#dce8e5;
    --text-dim:#a9bdb9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Quicksand',sans-serif;
    background:var(--bg-dark);
    color:var(--text-soft);
    line-height:1.65;
  }
  .texture-bg{
    background:
      radial-gradient(circle at 15% 15%, rgba(28,85,77,0.5), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(18,61,56,0.5), transparent 55%),
      linear-gradient(160deg, var(--bg-dark) 0%, var(--teal-1) 50%, var(--teal-2) 100%);
    border-bottom:1px solid rgba(220,232,229,0.08);
  }
  section{
    padding:5rem 8vw;
    max-width:1200px;
    margin:0 auto;
  }
  @media (max-width:700px){
    section{padding:3.5rem 6vw;}
  }
  .script{
    font-family:'Alex Brush', cursive;
    color:var(--magenta);
    line-height:1.1;
  }
  h2.script{
    font-size:clamp(2.6rem,7vw,4rem);
    margin-bottom:1.5rem;
  }

  /* ---------- Nav ---------- */
  nav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(7,17,15,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid rgba(220,232,229,0.1);
  }
  .nav-inner{
    max-width:1200px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0.9rem 8vw;
    font-family:'Cormorant Garamond',serif;
  }
  .nav-inner .brand{font-size:1.1rem;color:var(--cream);}
  .nav-links{display:flex;gap:1.6rem;list-style:none;}
  .nav-links a{color:var(--text-soft);text-decoration:none;font-size:0.95rem;letter-spacing:0.02em;}
  .nav-links a:hover{color:var(--magenta);}
  @media (max-width:600px){
    .nav-links{gap:1rem;}
    .nav-links a{font-size:0.85rem;}
  }

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;
    padding-top:4.5rem;
    padding-bottom:4.5rem;
  }
  .hero .eyebrow{
    font-family:'Cormorant Garamond',serif;
    font-size:1.1rem;
    color:var(--text-dim);
    letter-spacing:0.04em;
    margin-bottom:2.5rem;
  }
  .hero .headline{
    font-size:clamp(3rem, 10vw, 5.5rem);
    margin-bottom:1rem;
  }
  .hero .headline .line2{display:block;margin-top:-0.6rem;}
  .hero .tagline{
    font-family:'Cormorant Garamond',serif;
    font-size:1.3rem;
    color:var(--text-soft);
    max-width:44ch;
    margin:0 auto 2.5rem;
  }
  .hero-photo{
    width:min(220px, 55vw);
    aspect-ratio:1;
    margin:0 auto 2.5rem;
    border-radius:50%;
    background:linear-gradient(160deg, var(--teal-3), var(--teal-1));
    border:2px solid rgba(201,79,134,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:0.85rem;
    color:var(--text-dim);
    padding:1rem;
  }
  .hero-contact{
    display:flex;
    gap:1.8rem;
    justify-content:center;
    flex-wrap:wrap;
    font-size:0.95rem;
    color:var(--text-soft);
  }
  .hero-contact a{color:inherit;text-decoration:none;border-bottom:1px solid transparent;}
  .hero-contact a:hover{color:var(--magenta);border-bottom-color:var(--magenta);}

  /* ---------- About ---------- */
  .about-grid{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:3rem;
    align-items:center;
  }
  @media (max-width:800px){
    .about-grid{grid-template-columns:1fr;text-align:center;}
  }
  .headshot{
    width:100%;
    max-width:220px;
    aspect-ratio:1;
    margin:0 auto;
    border-radius:50%;
    background:linear-gradient(160deg,#2a0f18,#0e0e0e 60%);
    border:2px solid rgba(201,79,134,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:0.85rem;
    text-align:center;
    padding:1rem;
  }
  .about-text p{
    font-size:1.1rem;
    color:var(--text-soft);
    max-width:56ch;
  }

  /* ---------- Projects ---------- */
  .projects-sub{
    font-family:'Cormorant Garamond',serif;
    font-size:1.25rem;
    color:var(--text-soft);
    max-width:42ch;
    margin-bottom:3rem;
  }
  .project-list{
    display:flex;
    flex-direction:column;
    gap:1.8rem;
  }
  .project-item{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:1.2rem;
    align-items:start;
    padding-bottom:1.8rem;
    border-bottom:1px solid rgba(220,232,229,0.1);
  }
  .project-item:last-child{border-bottom:none;}
  .project-thumb{
    width:64px;
    height:64px;
    border-radius:50%;
    background:linear-gradient(160deg,var(--teal-3),var(--bg-dark));
    flex-shrink:0;
  }
  .project-item a.project-title{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:1.5rem;
    color:var(--cream);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .2s ease, color .2s ease;
  }
  .project-item a.project-title:hover,
  .project-item a.project-title:focus-visible{
    color:var(--magenta);
    border-bottom-color:var(--magenta);
  }
  .project-item p{
    font-size:0.95rem;
    color:var(--text-dim);
    margin-top:0.5rem;
    max-width:62ch;
  }

  /* ---------- Process ---------- */
  .process-sub{
    font-family:'Cormorant Garamond',serif;
    font-size:1.3rem;
    letter-spacing:0.04em;
    color:var(--text-soft);
    margin-bottom:2.5rem;
  }
  .process-steps{
    display:grid;
    gap:2rem;
  }
  .process-step{
    display:grid;
    grid-template-columns:44px 1fr;
    gap:1.2rem;
    padding:1.2rem;
    background:rgba(255,255,255,0.03);
    border-radius:12px;
  }
  .process-step .icon{font-size:1.5rem;}
  .process-step h3{
    font-family:'Cormorant Garamond',serif;
    font-size:1.4rem;
    color:var(--cream);
    margin-bottom:0.5rem;
  }
  .process-step ul{padding-left:1.1rem;color:var(--text-dim);font-size:0.9rem;}
  .process-step p{color:var(--text-dim);font-size:0.9rem;}

  /* ---------- Testimonials ---------- */
  .testimonial{
    display:grid;
    grid-template-columns:120px 1fr;
    gap:1.8rem;
    align-items:center;
    margin-bottom:2.5rem;
    padding-bottom:2.5rem;
    border-bottom:1px solid rgba(220,232,229,0.1);
  }
  .testimonial:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  @media (max-width:600px){
    .testimonial{grid-template-columns:1fr;text-align:center;}
  }
  .avatar{
    width:120px;
    height:120px;
    margin:0 auto;
    border-radius:50%;
    background:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    color:var(--bg-dark);
    text-align:center;
    font-size:0.85rem;
    padding:0.5rem;
  }
  .quote{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--text-soft);
    margin-bottom:0.8rem;
  }
  .attribution{color:var(--text-dim);font-size:0.9rem;}
  .attribution strong{color:var(--cream);display:block;font-style:normal;}

  /* ---------- Contact ---------- */
  .contact-section{text-align:center;}
  .contact-details{font-size:1.15rem;color:var(--cream);}
  .contact-details a{color:inherit;text-decoration:none;}
  .contact-details a:hover{color:var(--magenta);}
  .contact-details div{margin-bottom:0.4rem;}
  footer{
    text-align:center;
    padding:2rem;
    color:var(--text-dim);
    font-size:0.8rem;
    background:var(--bg-dark);
  }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="brand">Lindokuhle Mlotshwa</div>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#process">Process</a></li>
      <li><a href="#testimonials">Testimonials</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>
